<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Deepanshu — UX designer and writer</title>
    <style type="text/css" data-vite-dev-id="C:/Users/Deepanshu/DeepanshuPortfolio/src/style.css">
      *,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    Segoe UI,
    sans-serif;
}

.hero {
  position: relative;
  width: 100vw;
  height: 100dvh;
  min-height: 100vh;
}

#rive-canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: pointer;
}

.status {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  margin: 0;
  pointer-events: none;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  color: rgba(255, 255, 255, 0.7);
}

.status[hidden] {
  display: none;
}
</style>

  </head>
  <body>
    <main class="hero">
      <canvas id="rive-canvas" aria-label="Interactive portfolio intro animation"></canvas>
      <p id="status" class="status" hidden>Loading animation…</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
